name: Build APK Android

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'COLABORADORES_STATUS_PROTHEUS.*'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Instalar Dependências NPM
        run: |
          npm install

      - name: 5. Gerar Pacote Web Local (.build/dist)
        run: |
          node build.js

      - name: 6. Sincronizar com o Projeto Android (Capacitor Sync)
        run: |
          npx cap sync android

      - name: 7. Dar permissão de execução ao Gradle
        run: |
          chmod +x android/gradlew

      - name: 8. Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 9. Salvar e Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: apontamento-progeral-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
